@if (showSelector) {
  <div class="liturgical-div">
    <label>{{ liturgicalPeriodLabel() }}:</label>&nbsp;
    <select (change)="onLiturgicalPeriodChanged($event)">
      @for (periodSelector of litYearColorSelector; track periodSelector; let i = $index) {
        <option value="{{ i }}">
          {{ periodSelector.labelId | translate }}
        </option>
      }
    </select>
  </div>
}
<div class="box">
  @for (period of periods; track period) {
    <div class="period">
      <div class="label">{{ labelFromId(period.labelId) }}:</div>
      {{ period.startDate | date }} - {{ period.endDate | date }}
    </div>
  }
</div>
