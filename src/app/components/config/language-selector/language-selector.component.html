<select (change)="onLanguageSelectionChange($event)">
  @for (entry of items; track entry; let idx = $index) {
    <option
      [attr.test-id]="'lang-entry-' + idx"
      [value]="entry?.value"
      [selected]="isSelectedLanguage(entry)">
      {{ entry.displayValue | translate }}
    </option>
  }
</select>
